<ul>
    @for(shipment of shipments(); track shipment.id){
<li>{{shipment.id}}</li>
<li>{{shipment.trackingNumber}}</li>
<li>{{shipment.createdAt}}</li>
<li>{{shipment.currentLocation}}</li>
<li>{{shipment.destination}}</li>
<li>{{shipment.origin}}</li>
<li>{{shipment.estimatedDelivery}}</li>
}@empty {
    <li>no shipment yet</li>
}
</ul>
